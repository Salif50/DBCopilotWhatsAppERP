# =====================================================================
#  Stack "Assistant Client IA" — GuineeDev SARLU
#  n8n + PLUTO Control Plane + Redis + PostgreSQL + GOWA
#  Services optionnels : WAHA, Qdrant et ngrok
#
#  Démarrage :   docker compose up -d
#  Avec WAHA :   docker compose --profile waha up -d
#  Avec tunnel : docker compose --profile tunnel up -d
# =====================================================================

networks:
  cjp:
    driver: bridge

volumes:
  postgres_data:
  n8n_data:
  waha_sessions:
  qdrant_data:
  redis_data:
  gowa_data:

services:

  # ---------------------------------------------------------------
  # Base de données PostgreSQL (backend de n8n + données métier)
  # ---------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: cjp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [cjp]

  # ---------------------------------------------------------------
  # n8n — moteur de workflows (le cœur de l'automatisation)
  # ---------------------------------------------------------------
  n8n:
    image: n8nio/n8n:latest
    container_name: cjp-n8n
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      pluto-control:
        condition: service_healthy
    ports:
      - "5678:5678"
    environment:
      # --- Connexion à PostgreSQL ---
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=${POSTGRES_DB}
      - DB_POSTGRESDB_USER=${POSTGRES_USER}
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD}
      # --- Sécurité / persistance des credentials ---
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}

      # --- Autoriser les Code Nodes n8n à lire $env ---
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false

      # --- Variables PLUTO utilisées par les workflows ---
      - PLUTO_ERROR_ADMIN_PHONE=${PLUTO_ERROR_ADMIN_PHONE}
      - PLUTO_MANAGER_CHAT_ID=${PLUTO_MANAGER_CHAT_ID}
      - PLUTO_GOWA_SESSION_ID=${PLUTO_GOWA_SESSION_ID}
      - PLUTO_DEMO_ACTION_PHONE=${PLUTO_DEMO_ACTION_PHONE:-}
      - PLUTO_CONTROL_TOKEN=${PLUTO_CONTROL_TOKEN}
      - PLUTO_MEMORY_TTL_SECONDS=${PLUTO_MEMORY_TTL_SECONDS:-86400}
      - PLUTO_PROACTIVE_CONFIDENCE_MIN=${PLUTO_PROACTIVE_CONFIDENCE_MIN:-75}
      - PLUTO_ACTION_WEBHOOK_URL=${PLUTO_ACTION_WEBHOOK_URL:-}
      - PLUTO_SALES_DROP_THRESHOLD=${PLUTO_SALES_DROP_THRESHOLD:-0.20}
      - EXA_API_KEY=${EXA_API_KEY:-}
      # --- Réseau / accès ---
      - N8N_HOST=${N8N_HOST}
      - N8N_PORT=5678
      - N8N_PROTOCOL=${N8N_PROTOCOL}
      - WEBHOOK_URL=${WEBHOOK_URL}
      - N8N_SECURE_COOKIE=${N8N_SECURE_COOKIE}
      - N8N_PROXY_HOPS=1
      # --- Divers ---
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE}
      - TZ=${TZ}
      - N8N_RUNNERS_ENABLED=true
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_PERSONALIZATION_ENABLED=false
      - N8N_RESTRICT_FILE_ACCESS_TO=/data
    volumes:
      - n8n_data:/home/node/.n8n
      - ./data:/data

    networks: [cjp]

  # ---------------------------------------------------------------
  # WAHA — passerelle WhatsApp (temporaire, avant l'API officielle)
  # ---------------------------------------------------------------
  waha:
    # Sur Mac Apple Silicon (arm64), l'image "latest" n'a pas de build arm64.
    # Le tag "arm" fournit une image native arm64 (voir devlikeapro/waha sur Docker Hub).
    image: devlikeapro/waha:${WAHA_IMAGE_TAG:-latest}
    container_name: cjp-waha
    restart: unless-stopped
    depends_on:
      - n8n
    ports:
      - "3000:3000"
    environment:
      - WAHA_DASHBOARD_USERNAME=${WAHA_DASHBOARD_USERNAME:-admin}
      - WAHA_DASHBOARD_PASSWORD=${WAHA_DASHBOARD_PASSWORD:-}
      - WAHA_API_KEY=${WAHA_API_KEY:-}
      - WAHA_DASHBOARD_API_KEY=${WAHA_API_KEY:-}
      - WHATSAPP_DEFAULT_ENGINE=${WHATSAPP_DEFAULT_ENGINE:-WEBJS}
      # WAHA envoie les messages reçus vers n8n (réseau interne docker)
      - WHATSAPP_HOOK_URL=${WHATSAPP_HOOK_URL:-http://n8n:5678/webhook/gowa-db-copilot}
      - WHATSAPP_HOOK_EVENTS=${WHATSAPP_HOOK_EVENTS:-message}
    volumes:
      - waha_sessions:/app/.sessions
    networks: [cjp]
    profiles: ["waha"]

  # ---------------------------------------------------------------
  # GOWA — passerelle WhatsApp alternative (aldinokemal/go-whatsapp-web-multidevice)
  # Utilisée pour le test "message entrant -> GPT -> réponse auto"
  # ---------------------------------------------------------------
  gowa:
    image: aldinokemal2104/go-whatsapp-web-multidevice
    container_name: cjp-gowa
    restart: unless-stopped
    depends_on:
      - n8n
    ports:
      - "3001:3000"   # dashboard/API accessible depuis ta machine sur localhost:3001
    volumes:
      - gowa_data:/app/storages
    command:
      - rest
      - --basic-auth=${GOWA_BASIC_AUTH:-admin:admin}
      - --port=3000
    networks: [cjp]

  # ---------------------------------------------------------------
  # Qdrant — base vectorielle pour la mémoire / le RAG de l'assistant
  # ---------------------------------------------------------------
  qdrant:
    image: qdrant/qdrant:latest
    container_name: cjp-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"   # API REST / dashboard
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    networks: [cjp]
    profiles: ["rag"]

  # ---------------------------------------------------------------
  # Redis — mémoire conversationnelle temporaire de PLUTO
  # ---------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: cjp-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks: [cjp]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ---------------------------------------------------------------
  # PLUTO Control Plane — validation AST SQLGlot + mémoire Redis
  # Service interne : aucun port publié sur la machine hôte.
  # ---------------------------------------------------------------
  pluto-control:
    build:
      context: ./services/pluto-control-plane
    container_name: cjp-pluto-control
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_URL: redis://redis:6379/0
      PLUTO_CONTROL_TOKEN: ${PLUTO_CONTROL_TOKEN}
      PLUTO_MEMORY_TTL_SECONDS: ${PLUTO_MEMORY_TTL_SECONDS:-86400}
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request; assert json.load(urllib.request.urlopen('http://localhost:8080/health'))['redis']"]
      interval: 5s
      timeout: 3s
      retries: 15
    networks: [cjp]

  # ---------------------------------------------------------------
  # ngrok — tunnel public HTTPS vers n8n (OPTIONNEL, profil "tunnel")
  # Nécessite NGROK_AUTHTOKEN et NGROK_DOMAIN dans le .env
  # ---------------------------------------------------------------
  ngrok:
    image: ngrok/ngrok:latest
    container_name: cjp-ngrok
    restart: unless-stopped
    depends_on:
      - n8n
    command: ["http", "n8n:5678", "--url=${NGROK_DOMAIN}"]
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN}
    ports:
      - "4040:4040"   # interface d'inspection ngrok
    networks: [cjp]
    profiles: ["tunnel"]
